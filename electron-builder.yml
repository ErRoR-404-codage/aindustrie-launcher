appId: 'fr.secours-ain-rp.aindustrie'
productName: 'Aindustrie'
artifactName: '${productName}-setup-${version}.${ext}'

copyright: 'Copyright © 2026 Association Secours de l Ain RP - base HeliosLauncher (Daniel Scalzi, MIT)'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Association Secours de l Ain RP'
  vendor: 'Association Secours de l Ain RP'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'
publish:
  provider: 'github'
  owner: 'ErRoR-404-codage'
  repo: 'aindustrie-launcher'
