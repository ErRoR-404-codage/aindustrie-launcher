appId: 'fr.secours-ain-rp.aindustrie'
productName: "Ain'dustrie"
artifactName: 'Aindustrie-setup-${version}.${ext}'

copyright: 'Copyright © 2026 Ain''dustrie — basé sur Helios Launcher © Daniel Scalzi (MIT)'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,.eslintrc.json}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'Aindustrie-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: "Ain'dustrie"
  vendor: "Ain'dustrie"
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'

# Mises à jour automatiques depuis les releases GitHub du fork
publish:
  provider: github
  owner: ErRoR-404-codage
  repo: aindustrie-launcher
